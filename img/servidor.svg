    <rect x="76" y="150" width="100" height="6" rx="3"/><rect x="76" y="164" width="70" height="6" rx="3"/>
    <rect x="76" y="234" width="100" height="6" rx="3"/><rect x="76" y="248" width="70" height="6" rx="3"/>
    <rect x="76" y="318" width="100" height="6" rx="3"/><rect x="76" y="332" width="70" height="6" rx="3"/>
  </g>
  <circle class="luz z1" cx="214" cy="75" r="7" fill="#34c759"/>
