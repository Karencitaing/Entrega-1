  </defs>
  <rect x="40" y="20" width="220" height="360" rx="18" fill="url(#caja)" stroke="#d1d1d6" stroke-width="3"/>
  <g fill="#f5f5f7" stroke="#d1d1d6">
    <rect x="58" y="40" width="184" height="70" rx="8"/><rect x="58" y="124" width="184" height="70" rx="8"/>
    <rect x="58" y="208" width="184" height="70" rx="8"/><rect x="58" y="292" width="184" height="70" rx="8"/>
  </g>
  <g fill="#d1d1d6">
