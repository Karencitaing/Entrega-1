<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    .pulso { stroke-dasharray: 18 140; animation: correr 2.4s linear infinite; }
    .p2 { animation-delay: .6s; } .p3 { animation-delay: 1.2s; } .p4 { animation-delay: 1.8s; }
    @keyframes correr { from { stroke-dashoffset: 158; } to { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8f8ed"/>
    </linearGradient>
  </defs>
  <g stroke="#d1d1d6" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M200 20 V120"/><path d="M200 280 V380"/><path d="M20 200 H120"/><path d="M280 200 H380"/>
    <path d="M60 60 L140 140"/><path d="M340 60 L260 140"/><path d="M60 340 L140 260"/><path d="M340 340 L260 260"/>
  </g>
  <g stroke="#34c759" stroke-width="4" fill="none" stroke-linecap="round">
    <path class="pulso p1" d="M200 20 V120"/><path class="pulso p2" d="M380 200 H280"/>
    <path class="pulso p3" d="M200 380 V280"/><path class="pulso p4" d="M20 200 H120"/>
    <path class="pulso p2" d="M60 60 L140 140"/><path class="pulso p4" d="M340 340 L260 260"/>
  </g>
  <rect x="120" y="120" width="160" height="160" rx="28" fill="url(#cuerpo)" stroke="#34c759" stroke-width="3"/>
  <rect x="150" y="150" width="100" height="100" rx="18" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="200" y="212" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#248a3d" text-anchor="middle">CPU</text>
</svg>
