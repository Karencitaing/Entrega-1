<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420">
  <style>
    .barra { transform-box: fill-box; transform-origin: bottom; animation: subir 3s ease-in-out infinite alternate; }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; } .b5 { animation-delay: 1.2s; } .b6 { animation-delay: 1.5s; }
    .onda { stroke-dasharray: 420; stroke-dashoffset: 420; animation: dibujar 4s ease-in-out infinite; }
    @keyframes subir { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    @keyframes dibujar { 0% { stroke-dashoffset: 420; } 60%, 100% { stroke-dashoffset: 0; } }
  </style>
  <rect x="20" y="20" width="460" height="290" rx="16" fill="#e5e5ea" stroke="#d1d1d6" stroke-width="3"/>
  <rect x="36" y="36" width="428" height="258" rx="6" fill="#ffffff"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#1d1d1f">Panel de datos</text>
  <rect x="60" y="88" width="80" height="6" rx="3" fill="#e5e5ea"/>
  <rect class="barra b1" x="70" y="160" width="28" height="110" rx="4" fill="#16a34a"/>
  <rect class="barra b2" x="110" y="190" width="28" height="80" rx="4" fill="#22c55e"/>
  <rect class="barra b3" x="150" y="140" width="28" height="130" rx="4" fill="#248a3d"/>
  <rect class="barra b4" x="190" y="200" width="28" height="70" rx="4" fill="#4ade80"/>
  <rect class="barra b5" x="230" y="120" width="28" height="150" rx="4" fill="#16a34a"/>
  <rect class="barra b6" x="270" y="170" width="28" height="100" rx="4" fill="#22c55e"/>
  <path class="onda" d="M320 240 C 350 200, 370 250, 395 180 S 430 150, 445 110" fill="none" stroke="#30b0c7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="445" cy="110" r="6" fill="#16a34a"/>
  <path d="M215 310 H285 L300 370 H200 Z" fill="#d1d1d6"/>
  <rect x="160" y="368" width="180" height="16" rx="8" fill="#c7c7cc"/>
</svg>
